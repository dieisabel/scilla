default_install_hook_types:
- pre-push

repos:
- repo: local
  hooks:
  - id: check-formatting
    name: Check formatting
    entry: clang-format
    args: [ "--Werror", "--dry-run" ]
    language: "system"
    types: [ "c++", "c" ]
    pass_filenames: true
    exclude: ^(.vscode/)|(platforms/nucleo-g431kb/Drivers)|(platforms/nucleo-g431kb/Core)
